name: Release

on:
  # Run only after the CI workflow finished on main...
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # ...or by hand (for first setup and re-runs).
  workflow_dispatch:

# One release at a time. A newer one waits instead of cancelling a deploy half-way.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The exact commit that passed CI.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    name: Build, scan, push (${{ matrix.name }})
    # Only release commits whose CI was green.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            file: server/Dockerfile
          - name: web
            file: client/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@v3

      # Image names must be lowercase.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kryptopaste-${{ matrix.name }}" >> "$GITHUB_ENV"

      - name: Build (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          build-args: GIT_SHA=${{ env.SHA }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # Fail the release if the image has a HIGH or CRITICAL vulnerability that
      # already has a fix available.
      - name: Scan with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            "$IMAGE:$SHA"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build again: the cache makes it instant and gives the same layers.
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest
          build-args: GIT_SHA=${{ env.SHA }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.name }}

  deploy:
    name: Deploy to Render
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production # holds the secrets, and can require approval
    steps:
      - name: Trigger deploys and verify
        env:
          API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          WEB_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          set -euo pipefail

          # Before production is set up, skip politely instead of failing.
          if [ -z "$API_HOOK" ] || [ -z "$WEB_HOOK" ] || [ -z "$PROD_URL" ]; then
            echo "::notice::Production is not configured yet. Skipping the deploy."
            exit 0
          fi

          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMG="ghcr.io%2F${OWNER}%2Fkryptopaste-api%3A${SHA}"

          echo "Deploying the api image for commit $SHA"
          curl -fsS -X POST "${API_HOOK}&imgURL=${IMG}" > /dev/null
          echo "Deploying the website"
          curl -fsS -X POST "${WEB_HOOK}" > /dev/null

          echo "Waiting for the new version to answer (the free tier can be slow)..."
          for i in $(seq 1 60); do
            LIVE="$(curl -fsS --max-time 30 "$PROD_URL/api/health" | jq -r '.version' 2>/dev/null || true)"
            if [ "$LIVE" = "$SHA" ]; then
              echo "Live version is $LIVE"
              curl -fsS "$PROD_URL/api/ready"
              echo
              curl -fsSI "$PROD_URL/" | grep -i "content-security-policy" > /dev/null
              echo "Site is up and sends the CSP header."
              exit 0
            fi
            echo "  not yet (live: '${LIVE:-nothing}'), attempt $i/60"
            sleep 10
          done

          echo "::error::The new version did not come up within 10 minutes."
          exit 1
