name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the pipeline can only read the repo.
permissions:
  contents: read

# A new push cancels the older run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27018/kryptopaste-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          load: true
          tags: kryptopaste-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          load: true
          tags: kryptopaste-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Smoke test api image (boots and reaches the database)
        run: |
          docker run -d --name api --network host \
            -e MONGODB_URI=mongodb://127.0.0.1:27018/kryptopaste-ci \
            kryptopaste-api:ci
          for i in $(seq 1 20); do
            if curl -fsS localhost:6209/api/ready; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

      - name: Smoke test web image (serves the app with the CSP)
        run: |
          docker run -d --name web -p 8080:8080 \
            -e API_UPSTREAM=http://127.0.0.1:9 kryptopaste-web:ci
          for i in $(seq 1 20); do
            if curl -fsS localhost:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsSI localhost:8080/ | grep -i "content-security-policy"
          curl -fsS localhost:8080/p/AAAAAAAAAAAAAAAAAAAAAA | grep -i "<div id=\"root\">"
