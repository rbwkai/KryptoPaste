name: kryptopaste

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - server/.env # MONGODB_URI and friends, passed at run time, never baked in
    environment:
      PORT: '6209'
      TRUST_PROXY: '1' # one proxy (nginx) sits in front of the API
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080' # reachable only from your own computer
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
